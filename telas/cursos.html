<!--
  IBREP Prism — Tela: Cursos por Instituição
  ---------------------------------------------------
  Fragmento HTML da tela "Cursos por Instituição" (estados + instituições
  + cursos/currículos/disciplinas/AVAs/certificados). Carregado sob
  demanda (fetch) na primeira vez que o usuário clica no botão "Cursos
  por Instituição", e injetado dentro de #tela-cursos-slot no index.html.
-->
  <div id="cursos-screen">
    <div class="port-header">
      <img src="https://ibrep.alfamaoraculo.com.br/assets/imagens/provasimpressas/logotipo_ibrep-prreto-55-min-1.png"
        alt="IBREP">
      <div class="header-divider"></div>
      <div class="header-text">
        <h1>Cursos por Instituição</h1>
        <p>Estados · Instituições · Cursos</p>
      </div>
    </div>
    <div class="regras-body">

      <aside class="regras-cats-pane">
        <div class="tut-cats-label">Estados</div>
        <div class="regras-cats-list" id="cursos-estados-list"></div>
        <button class="admin-dashed-btn regras-admin-only" style="width:100%;margin-top:8px;" onclick="adicionarEstadoCursos()">➕ Adicionar estado</button>
      </aside>

      <div class="regras-list-pane">
        <div class="regras-list-header">
          <div class="regras-search-box" style="padding:0 0 10px;border-bottom:none;">
            <input type="text" id="cursos-inst-search" placeholder="Buscar instituição..." oninput="renderCursosInstList()">
          </div>
          <div class="regras-list-header-title" id="cursos-inst-title">—</div>
          <div class="regras-list-header-count" id="cursos-inst-count"></div>
        </div>
        <div class="regras-list-items" id="cursos-inst-items"></div>
        <button class="admin-dashed-btn regras-admin-only" style="width:calc(100% - 16px);margin:8px;" onclick="adicionarInstituicaoCursos()">➕ Adicionar instituição</button>
      </div>

      <div class="regras-detail-pane" id="cursos-detail-pane">
        <div class="regras-empty-state">
          <div class="icon"></div>
          <p>Selecione uma instituição para ver os cursos disponíveis</p>
        </div>
      </div>

    </div>
  </div>
